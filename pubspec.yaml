name: card_scorekeeper
description: A Flutter card game scorekeeper app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  
  # UI Enhancements
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  flex_color_scheme: ^7.3.1
  
  # Multiplayer Features
  qr_flutter: ^4.1.0          # QR code generation
  mobile_scanner: ^4.0.1      # QR code scanning (modern alternative)
  permission_handler: ^11.3.1  # Camera permissions
  shelf: ^1.4.1                # HTTP server
  shelf_web_socket: ^1.0.4     # WebSocket support
  web_socket_channel: ^2.4.5   # WebSocket client
  http: ^1.2.0                 # HTTP requests

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
